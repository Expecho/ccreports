# Publishes to npm when a version tag (v1.2.3) is pushed, using npm trusted
# publishing (OIDC): no token is stored, and npm adds provenance automatically.
# The trusted publisher is configured on npmjs.com for this workflow file.
# Then creates the GitHub release for the tag, unless it already exists.
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write # create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check the tag matches the package and plugin versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")
          echo "tag $tag, package.json $pkg, plugin.json $plugin"
          test "$tag" = "$pkg" && test "$tag" = "$plugin"
      # Zero dependencies, so there is nothing to install.
      - run: npm test
      - run: npm publish
      # Generated notes; edit them on GitHub afterwards to describe the release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" > /dev/null 2>&1 && { echo "release $tag already exists"; exit 0; }
          gh release create "$tag" --title "ccreports ${tag#v}" --generate-notes --verify-tag
